name: Deploy qtfycg

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build project
        working-directory: qtfycg
        run: mvn clean package -DskipTests

      - name: Prepare deploy artifact
        run: |
          mkdir -p deploy

          JAR_FILE=$(find ./qtfycg -path "*/target/*.jar" \
            ! -name "*sources.jar" \
            ! -name "*javadoc.jar" \
            ! -name "original-*.jar" \
            | head -n 1)

          if [ -z "$JAR_FILE" ]; then
            echo "No jar file found."
            exit 1
          fi

          echo "Found jar: $JAR_FILE"
          cp "$JAR_FILE" deploy/qtfycg.jar
          ls -lh deploy/qtfycg.jar

      - name: Upload jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          source: deploy/qtfycg.jar
          target: /opt/qtfycg/upload
          strip_components: 1

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: ${{ secrets.SERVER_PORT }}
          key: ${{ secrets.SERVER_PRIVATE_KEY }}
          script: |
            set -e

            echo "Create directories..."
            mkdir -p /opt/qtfycg/app
            mkdir -p /opt/qtfycg/backup
            mkdir -p /opt/qtfycg/logs
            mkdir -p /opt/qtfycg/upload

            echo "Check uploaded jar..."
            ls -lh /opt/qtfycg/upload/qtfycg.jar

            echo "Backup old jar..."
            if [ -f /opt/qtfycg/app/qtfycg.jar ]; then
              cp /opt/qtfycg/app/qtfycg.jar /opt/qtfycg/backup/qtfycg-$(date +%Y%m%d%H%M%S).jar
            fi

            echo "Replace jar..."
            cp /opt/qtfycg/upload/qtfycg.jar /opt/qtfycg/app/qtfycg.jar

            echo "Restart qtfycg service..."
            sudo /usr/bin/systemctl restart qtfycg

            echo "Show qtfycg service status..."
            sudo /usr/bin/systemctl status qtfycg --no-pager